[pytest]
# Pytest configuration for PromptSleuth

# Test paths
testpaths = ../tests/prompt_sleuth

# Python files
python_files = test_*.py

# Python classes
python_classes = Test*

# Python functions
python_functions = test_*

# Minimum version
minversion = 7.0

# Add current directory to Python path
pythonpath = .

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests requiring API access
    unit: marks tests as unit tests (no external dependencies)

# Coverage options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Ignore directories
norecursedirs = .git .venv venv env __pycache__ .pytest_cache

# Log configuration
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
