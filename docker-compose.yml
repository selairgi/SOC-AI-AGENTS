services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: soc-postgres
    environment:
      # Note: If you see "database 'soc' does not exist" errors, check your .env file
      # and ensure POSTGRES_DB is set to 'soc_db' (or update all connection strings)
      POSTGRES_DB: ${POSTGRES_DB:-soc_db}
      POSTGRES_USER: ${POSTGRES_USER:-soc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soc_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-soc} -d ${POSTGRES_DB:-soc_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - soc-network

  # Redis for rate limiting and caching
  redis:
    image: redis:7-alpine
    container_name: soc-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - soc-network

  # Web Application (with V7.1 Security Pipeline + ML Ensemble)
  web:
    build:
      context: .
      dockerfile: ./web/Dockerfile
      args:
        # Set to 'true' to copy pre-trained ML models into container
        # Models will be trained on first run if not included
        COPY_ML_MODELS: ${COPY_ML_MODELS:-false}
    container_name: soc-web
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-3.5-turbo}
      - POSTGRES_URL=postgresql://${POSTGRES_USER:-soc}:${POSTGRES_PASSWORD:-soc_password}@postgres:5432/${POSTGRES_DB:-soc_db}
      - REDIS_URL=redis://redis:6379/0
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-local}
      - CTF_FLAG=${CTF_FLAG}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5000}
      - SESSION_COOKIE_SECURE=False
      - PYTHONPATH=/app
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./web:/app
      - ./shared:/app/shared
      - ./security:/app/security
      - ./core:/app/core
      - ./ai:/app/ai
      - ./enterprise:/app/enterprise
      - ./prompt_sleuth:/app/prompt_sleuth
      - web_logs:/app/logs
      # V7.1: Persist ML models cache across container restarts
      - ml_models_cache:/app/security/.cache
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    networks:
      - soc-network
    restart: unless-stopped

